name: e2e-tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npx tsx src/app.ts &
          sleep 3
      - name: Run the autotest
        run: npx playwright test tests/tc110.spec.ts
